{{ define "main" }}
<main class="content">
    {{ if or .Title .Content }}
    <div class="content-chunk" style="margin-bottom: 1.5rem;">
        {{ with .Title }}<h1>{{ . }}</h1>{{ end }}
        {{ with .Content }}<hr><div class="container">{{ . }}</div>{{ end }}
    </div>
    {{ end }}

    {{ range .Paginator.Pages }}
        {{ .Render "summary" }}
    {{ end }}
    {{ partial "pagination.html" . }}
</main>
{{ end }}
